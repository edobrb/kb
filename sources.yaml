# What `npm run sync` gathers into kb/. Credentials live in .env (see .env.example).
# Two sources are indexed: the Developer Portal and the GitLab repositories (docs AND source code).
# Confluence is not indexed any more: it is only searched for pages about each repository (see below).
# Unknown keys fall back to defaults (src/sync/sources-config.ts).

# ---- Developer Portal (Backstage + TechDocs) — source of truth for documentation -----------------
# Every catalog entity with TechDocs is indexed from the portal's rendered docs, so repositories
# you cannot read on GitLab are still covered. OpenAPI/AsyncAPI definitions of API entities too.
# The catalog metadata (owner, system, lifecycle) also feeds the GitLab project cards.
devportal:
  enabled: true
  include_api_definitions: true
  max_definition_chars: 200000
  exclude_entities: [] # "component/some-name"
  min_body_chars: 40

# ---- GitLab (biosphere.teamsystem.com) ---------------------------------------------------------
# For every repository: markdown docs, source files (one document per file, `kind: code`) and a
# project card (`kind: project`: description, Dev Portal owner/system, README, languages, related
# Confluence pages). Scope is the oneplatform group only for now — 348 repositories, ~40k source files
# — because the contextual-retrieval step costs one LLM generation per chunk (see README §7.3).
gitlab:
  enabled: true
  groups: # searched recursively (sub-groups included); only what the token can see
    - oneplatform
    # - tsdigital   # 1049 projects: enable once oneplatform is indexed and the throughput is known
    # - paas
    # - madbit
  projects: [] # extra "group/subgroup/project" paths outside the groups above
  exclude_projects: # never indexed (wildcards allowed, case-insensitive)
    - oneplatform/PET/llm-wiki* # the repo that held the previous, hand-assembled kb export
    - "*/archived/*"
    - "*/deprecated/*"
  include_archived: false
  min_body_chars: 40
  project_cards: true
  docs:
    enabled: true
    include: ["**/*.md", "**/*.markdown", "**/*.mdx"]
    exclude:
      - "**/node_modules/**"
      - "**/vendor/**"
      - "**/CHANGELOG*"
      - "**/LICENSE*"
      - "**/.gitlab/**"
      - "**/.github/**"
      - "**/PULL_REQUEST_TEMPLATE*"
      - "**/*.template.md"
      - "**/test/**"
      - "**/tests/**"
    max_file_kb: 2048
    # Repositories the portal already renders: skip their mkdocs content (docs/**), keep README & co.
    skip_techdocs_if_in_devportal: true
  code:
    enabled: true
    # Defaults (src/sync/sources-config.ts) cover TypeScript/JavaScript, Python, Kotlin/Java, Go, C#, Rust,
    # SQL, shell, Terraform, YAML/TOML, Dockerfiles, build files, package.json and OpenAPI/JSON schemas,
    # and exclude node_modules/dist/build/vendor, lockfiles, minified files, *.d.ts, fixtures, generated code.
    # Override `include` / `exclude` here to change the file set.
    max_file_kb: 256
    max_lines: 4000
    max_files_per_project: 5000 # more than this = vendored/generated content: code skipped, folders logged
    skip_tests: true # test files are ~12 % of the source files; flip to false to index them too

# ---- Confluence (teamsystem.atlassian.net) — enrichment only -------------------------------------
# For each repository the wiki is searched (title first, then full text) for the project name; the top
# pages (title, link, snippet) go on the project card. Restrict `spaces.include` to the R&D/platform
# spaces to keep the hits relevant; empty = every space the token can see (personal spaces are never used).
confluence:
  enrich_projects: true
  spaces:
    include: [CTO, TeamCore, TONEPLAT, TPAAS, TSDIGITAL, GP, OBO, TeamWorksp, TeamMeteri, DShub, RPDD]
    exclude: []
  max_pages_per_project: 3
  excerpt_chars: 400
  refresh_days: 30 # a project's lookup is repeated only after this many days

# ---- Rules: authority / source_type / skip by id, url or title (first match wins) -------------
# `*` matches anything. Ids look like:
#   devportal:<ns>/<kind>/<name>/<page/path/>   devportal:<ns>/api/<name>#definition
#   gitlab:<group>/<project>:<file path>          gitlab:<group>/<project>:__project
rules:
  - match: "gitlab:oneplatform/adrs:template.md"
    skip: true
  - match: "gitlab:oneplatform/adrs:*.md"
    source_type: adr
    authority: binding
  - match: "devportal:*/adr*"
    authority: binding
  - title: "*ADR[0-9]*"
    authority: binding
